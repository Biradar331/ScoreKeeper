<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create_Account</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
  </head>
  <body>
    <section class="section">
      <div class="box is-offset-one-quarter">
        <div class="field">
          <label class="label">Full Name :</label>
          <div class="control">
            <input
              class="input"
              type="text"
              placeholder="Text input"
              aria-required="true"
              required
            />
          </div>
        </div>

        <div class="field">
          <label class="label">Username :</label>
          <div class="control has-icons-left has-icons-right">
            <input
              class="input is-success"
              type="text"
              placeholder="Text input"
              value=""
              required
            />
            <span class="icon is-small is-left">
              <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
              <i class="fas fa-check"></i>
            </span>
          </div>
          <p class="help is-success">This username is available</p>
        </div>

        <div class="field">
          <label class="label">Email ID : </label>
          <div class="control has-icons-left has-icons-right">
            <input
              class="input is-danger"
              type="email"
              placeholder="Email input"
              value=""
              required
            />
            <span class="icon is-small is-left">
              <i class="fas fa-envelope"></i>
            </span>
            <span class="icon is-small is-right">
              <i class="fas fa-exclamation-triangle"></i>
            </span>
          </div>
          <p class="help is-danger">This email is invalid</p>
        </div>

        <div class="field">
          <label class="label">Password :</label>
          <div class="control">
            <input
              class="input"
              type="password"
              placeholder="Enter a New Password"
            />
          </div>
        </div>

        <div class="field">
          <label class="label">Re Enter a Password :</label>
          <div class="control">
            <input
              class="input"
              type="password"
              placeholder="Re Enter a Password"
            />
          </div>
        </div>

        <div class="field">
          <label class="label">Subject :</label>
          <div class="control">
            <div class="select">
              <select>
                <option value="Cricket">Cricket</option>
                <option value="Table Tennis" selected>Table Tennis</option>
                <option value="Kabaddi">Kabaddi</option>
              </select>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="label">Tournament Details (Name & etc.,) :</label>
          <div class="control">
            <textarea class="textarea" placeholder="Textarea"></textarea>
          </div>
        </div>

        <div class="field">
          <div class="control">
            <label class="checkbox">
              <input type="checkbox" required />
              I agree to the
              <a
                href="../../Text_Documents/ScoreKeeper_Terms_and_Conditions.txt"
                target="_blank"
              >
                terms and conditions
              </a>
            </label>
          </div>
        </div>

        <!-- <div class="field">
          <div class="control">
            <label class="radio">
              <input type="radio" name="question" />
              Yes
            </label>
            <label class="radio">
              <input type="radio" name="question" />
              No
            </label>
          </div>
        </div> -->

        <div class="field is-grouped">
          <div class="control">
            <button class="button is-link">Submit</button>
          </div>
          <div class="control">
            <button class="button is-link is-light">Cancel</button>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
