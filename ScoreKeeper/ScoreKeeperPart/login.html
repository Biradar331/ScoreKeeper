<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <section class="section">
      <form class="box column is-half is-offset-one-quarter">
        <div class="field">
          <label class="label">Username :</label>
          <div class="control">
            <input
              class="input"
              type="email"
              placeholder="Enter your username here"
              required
            />
          </div>
        </div>

        <div class="field">
          <label class="label">Password :</label>
          <div class="control">
            <input
              class="input"
              type="password"
              placeholder="Enter the password you have created"
              required
            />
          </div>
        </div>

        <div class="tags has-addons is-large is-rounded is-hoverable">
          <span class="tag is-large is-rounded"
            ><button class="takeBack">Back</button></span
          >
          <span class="tag is-primary is-large is-rounded"
            ><button class="signin">Sign in</button></span
          >
        </div>
      </form>
    </section>
    <link rel="jsdelivr" href="login.js" />
  </body>
</html>
